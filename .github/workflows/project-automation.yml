name: Project automation

on:
  issues:
    types: [opened, reopened, edited, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional Issue to resync; leave empty to bootstrap"
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-project:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-project-automation.yml@b1deb7b1069739879d7a4acb9cd3521bca835049
    with:
      authentication: broker-user
      broker_url: https://appfactory-project-token-broker.lawrynnjennifer.workers.dev/v1/github/user-token
      broker_audience: appfactory-project-automation
      appfactory_ref: b1deb7b1069739879d7a4acb9cd3521bca835049
      config_path: .github/project-config.json
      issue_number: ${{ inputs.issue_number }}
